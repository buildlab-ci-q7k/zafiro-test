name: Zafiro stock test build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Clone stock Zafiro (MIT)
        run: |
          git clone --depth 1 https://github.com/niki914/zafiro.git z
          cd z && git rev-parse HEAD | tee ../ZAFIRO_COMMIT; cat LICENSE | head -3
          ls app; ls app/src 2>/dev/null
      - name: Build debug
        working-directory: z
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -x lint 2>&1 | tail -150 || true
          find . -name '*.apk' | xargs ls -l
      - name: Pick APK and size
        run: |
          APK=$(find z -name '*.apk' -path '*debug*' | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          echo "ZAFIRO_APK_BYTES $(stat -c %s "$APK")"
          unzip -l "$APK" | sort -k1 -n -r | head -15
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/aapt dump badging "$APK" | grep -E "package:|sdkVersion|uses-permission" | head -40
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ci_zafiro_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zafiro-shots, path: shots }
